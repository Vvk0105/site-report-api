
# Production. Set POSTGRES_PASSWORD in the environment (or an untracked .env next to
# this file) before running `docker compose -f docker-compose.prod.yml up -d`.
# DATABASE_URL in backend/.env must use the same password.

services:
  db:
    image: postgres:16
    container_name: site-report-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: site_report

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: site-report-api
    restart: unless-stopped

    # Bound to localhost; the public entry point is a TLS reverse proxy.
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    # Folder on the server holding AppleRootCA-G3.cer (see APPLE_ROOT_CA_PATH in .env).
    volumes:
      - ./certs:/app/certs:ro

    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

    depends_on:
      - db

volumes:
  postgres_data:
